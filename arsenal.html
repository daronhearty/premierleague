<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arsenal | Premier League Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
    <div class="site-hero">
        <div class="site-brand">
            <a href="index.html" class="brand-link" aria-label="No Spoilers! Premier League home">
                <img src="assets/logo.svg" alt="No Spoilers! Premier League">
            </a>
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a href="latest.html"><span class="nav-icon">◉</span><span>Latest</span></a>
        <a href="table.html"><span class="nav-icon">▥</span><span>Table</span></a>
        <a href="arsenal.html"><span class="nav-icon">◆</span><span>Arsenal</span></a>
    </nav>
</header>


    <main class="arsenal-page">

        <!-- =========================
             ARSENAL HEADER
             ========================= -->

        <section class="arsenal-header">

            <img
                src="https://crests.football-data.org/57.png"
                alt="Arsenal crest"
                class="arsenal-crest"
            >

            <div>
                <h2>Arsenal</h2>
                <p>2026/27 Premier League</p>
            </div>

        </section>


        <!-- =========================
             LATEST MATCH
             ========================= -->

        <section>

            <h2>Latest Match</h2>

            <div id="arsenal-latest-match" class="arsenal-feature">

                <p class="loading">
                    Loading latest Arsenal match...
                </p>

            </div>

        </section>


        <!-- =========================
             NEXT MATCH
             ========================= -->

        <section>

            <h2>Next Match</h2>

            <div id="arsenal-next-match" class="arsenal-feature">

                <p class="loading">
                    Loading next Arsenal match...
                </p>

            </div>

        </section>


        <!-- =========================
             RECENT RESULTS
             ========================= -->

        <section>

            <h2>Recent Results</h2>

            <div id="arsenal-results" class="matches">

                <p class="loading">
                    Loading Arsenal results...
                </p>

            </div>

        </section>


        <!-- =========================
             UPCOMING FIXTURES
             ========================= -->

        <section>

            <h2>Upcoming Fixtures</h2>

            <div id="arsenal-fixtures" class="matches">

                <p class="loading">
                    Loading Arsenal fixtures...
                </p>

            </div>

        </section>

    </main>


    <footer>
        <p>Premier League Tracker</p>
    </footer>


    <script src="header.js"></script>
    <script src="arsenal.js"></script>

</body>

</html>
