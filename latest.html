<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premier League Tracker - Latest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
    <div class="site-hero">
        <div class="site-brand">
            <a href="index.html" class="brand-link" aria-label="No Spoilers! Premier League home">
                <img src="assets/logo.svg" alt="No Spoilers! Premier League">
            </a>
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html"><span class="nav-icon">⌂</span><span>Home</span></a>
        <a href="latest.html"><span class="nav-icon">◉</span><span>Latest</span></a>
        <a href="table.html"><span class="nav-icon">▥</span><span>Table</span></a>
        <a href="arsenal.html"><span class="nav-icon">◆</span><span>Arsenal</span></a>
    </nav>
</header>


    <main>

        <!-- LIVE MATCHES -->
        <section>
            <h2>🔴 Live Matches</h2>

            <div id="live-matches" class="matches">
                <p class="loading">Checking for live matches...</p>
            </div>
        </section>


        <!-- TODAY'S MATCHES -->
        <section>
            <h2>📅 Today's Matches</h2>

            <div id="todays-matches" class="matches">
                <p class="loading">Loading today's matches...</p>
            </div>
        </section>


        <!-- LATEST RESULTS -->
        <section>
            <h2>⚽ Latest Results</h2>

            <div id="latest-results" class="matches">
                <p class="loading">Loading latest results...</p>
            </div>
        </section>


        <!-- NEXT FIXTURES -->
        <section>
            <h2>🗓️ Next Fixtures</h2>

            <div id="next-fixtures" class="matches">
                <p class="loading">Loading next fixtures...</p>
            </div>
        </section>

    </main>


    <footer>
        <p>Premier League Tracker</p>
        <p>by Daron Hearty</p>
    </footer>


    <script src="header.js"></script>
    <script src="app.js"></script>

</body>
</html>
