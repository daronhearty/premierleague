<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Premier League - No Spoilers</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="site-header">
    <div class="site-hero">
        <div class="site-brand">
            <a href="index.html" class="brand-link" aria-label="No Spoilers! Premier League home">
                <img src="assets/logo.svg" alt="No Spoilers! Premier League">
            </a>
            <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" role="presentation"><path d="M4 14.5 16 4l12 10.5"/><path d="M7.5 12.5V27h17V12.5"/><path d="M12 27V18h8v9"/></svg></span><span>Home</span></a>
        <a href="latest.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" role="presentation"><circle cx="16" cy="16" r="12"/><path d="m13 11 8 5-8 5z"/></svg></span><span>Latest</span></a>
        <a href="table.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" role="presentation"><rect x="4" y="6" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="4" y="14" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><rect x="4" y="22" width="4" height="4" rx="1" fill="currentColor" stroke="none"/><path d="M13 8h15M13 16h15M13 24h15"/></svg></span><span>Table</span></a>
        <a href="arsenal.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 32 32" role="presentation"><path d="M9 8h4M19 8h4M8 8c0 6 2.5 9 8 9s8-3 8-9"/><path d="M11 8c.3 8 1.7 11 5 11s4.7-3 5-11"/><path d="M16 19v5M11 27h10M12.5 24h7"/></svg></span><span>Arsenal</span></a>
    </nav>
</header>

<main>

    <section class="team-selector-section">

        <h2>No Spoilers</h2>

        <p>
            Select your team and we'll hide their matches and results.
        </p>

        <br>
        
        <div class="team-selector">

            <label for="team-select">
                My team
            </label>
            <select id="team-select">
                <option value="">Select your team...</option>
            </select>

        </div>

        <div class="team-badge-picker">
            <div id="team-badges" class="team-badges"></div>
        </div>

    </section>


    <section>

        <h2>Today's Fixtures</h2>

        <div id="todays-fixtures" class="matches">

            <p class="loading">
                Select your team to continue.
            </p>

        </div>

    </section>


    <section>

        <h2>Latest Results</h2>

        <div id="latest-results" class="matches">

            <p class="loading">
                Select your team to continue.
            </p>

        </div>

    </section>

</main>

<footer>
    <p>Premier League Tracker</p>
    <p>by Daron Hearty</p>
    <p>Football data provided by the Football-Data.org API</p>
</footer>

<script src="header.js"></script>
    <script src="nospoilers.js"></script>

</body>

</html>
